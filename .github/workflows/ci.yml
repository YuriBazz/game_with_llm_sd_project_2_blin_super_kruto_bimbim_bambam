name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libcurl4-openssl-dev nlohmann-json3-dev

      - name: Build game-service
        working-directory: game-service
        run: |
          mkdir -p build && cd build
          cmake ..
          cmake --build .
          ctest --output-on-failure

      - name: Build mcp-server
        working-directory: mcp-server
        run: |
          mkdir -p build && cd build
          cmake ..
          cmake --build .

      - name: Build agent-runner
        working-directory: agent-runner
        run: |
          mkdir -p build && cd build
          cmake ..
          cmake --build .

      - name: Build web-client
        working-directory: web-client
        run: |
          npm ci
          npm run build
