# Optional override for NVIDIA GPU (requires nvidia-container-toolkit).
# Usage: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up
services:
  ollama:
    devices: !reset null
    group_add: !reset null
    environment:
      OLLAMA_VULKAN: "0"
      HSA_OVERRIDE_GFX_VERSION: ""
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
