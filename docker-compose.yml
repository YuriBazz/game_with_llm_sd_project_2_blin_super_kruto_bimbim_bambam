services:
  game-service:
    build: ./game-service
    ports:
      - "8080:8080"
    environment:
      - GODMODE=${GODMODE:-true}
    networks:
      - game-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  mcp-server:
    build: ./mcp-server
    depends_on:
      game-service:
        condition: service_healthy
    environment:
      - GAME_SERVICE_HOST=game-service
      - GAME_SERVICE_PORT=8080
    networks:
      - game-net
    stdin_open: true
    tty: true

  agent-runner-rival:
    build:
      context: .
      dockerfile: agent-runner/Dockerfile
    depends_on:
      game-service:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    environment:
      - AGENT_SLOT=rival
      - AGENT_LABEL=A
      - ROBOT_A_LLM_PROVIDER=${ROBOT_A_LLM_PROVIDER:-${ROBOT_A_LLM_PROVIDER_FALLBACK:-ollama}}
      - MCP_SERVER_PATH=/usr/local/bin/mcp_server
      - GAME_SERVICE_HOST=game-service
      - GAME_SERVICE_PORT=8080
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - ROBOT_A_OLLAMA_MODEL=${ROBOT_A_OLLAMA_MODEL:-${ROBOT_A_OLLAMA_MODEL_FALLBACK:-qwen2.5:3b}}
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ROBOT_A_OPENAI_MODEL=${ROBOT_A_OPENAI_MODEL:-${ROBOT_A_OPENAI_MODEL_FALLBACK:-gpt-4o-mini}}
      - ROBOT_A_CURSOR_MODEL=${ROBOT_A_CURSOR_MODEL:-composer-2.5}
      - ROBOT_A_CURSOR_BRIDGE_URL=${ROBOT_A_CURSOR_BRIDGE_URL:-http://cursor-llm-bridge-a:8765}
      - MAX_STEPS=${MAX_STEPS:-500}
      - MAX_TOKENS=${MAX_TOKENS:-5000}
      - MAX_TOTAL_TOKENS=${MAX_TOTAL_TOKENS:-50000}
      - GAME_SEED=${GAME_SEED:-42}
      - AGENT_LOG_PATH=/logs/agent-rival.log
    volumes:
      - agent_logs:/logs
    networks:
      - game-net

  agent-runner-player:
    build:
      context: .
      dockerfile: agent-runner/Dockerfile
    depends_on:
      game-service:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    environment:
      - AGENT_SLOT=player
      - AGENT_LABEL=H
      - ROBOT_H_LLM_PROVIDER=${ROBOT_H_LLM_PROVIDER:-${ROBOT_H_LLM_PROVIDER_FALLBACK:-ollama}}
      - MCP_SERVER_PATH=/usr/local/bin/mcp_server
      - GAME_SERVICE_HOST=game-service
      - GAME_SERVICE_PORT=8080
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - ROBOT_H_OLLAMA_MODEL=${ROBOT_H_OLLAMA_MODEL:-${ROBOT_H_OLLAMA_MODEL_FALLBACK:-qwen2.5:3b}}
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ROBOT_H_OPENAI_MODEL=${ROBOT_H_OPENAI_MODEL:-${ROBOT_H_OPENAI_MODEL_FALLBACK:-gpt-4o-mini}}
      - ROBOT_H_CURSOR_MODEL=${ROBOT_H_CURSOR_MODEL:-composer-2.5}
      - ROBOT_H_CURSOR_BRIDGE_URL=${ROBOT_H_CURSOR_BRIDGE_URL:-http://cursor-llm-bridge-h:8765}
      - MAX_STEPS=${MAX_STEPS:-500}
      - MAX_TOKENS=${MAX_TOKENS:-5000}
      - MAX_TOTAL_TOKENS=${MAX_TOTAL_TOKENS:-50000}
      - GAME_SEED=${GAME_SEED:-42}
      - AGENT_LOG_PATH=/logs/agent-player.log
    volumes:
      - agent_logs:/logs
    networks:
      - game-net

  web-client:
    build: ./web-client
    ports:
      - "5173:80"
    depends_on:
      game-service:
        condition: service_healthy
    networks:
      - game-net

  cursor-llm-bridge-h:
    profiles:
      - cursor-h
    build:
      context: .
      dockerfile: cursor-llm-bridge/Dockerfile
    ports:
      - "8765:8765"
    environment:
      - ROBOT_LABEL=H
      - CURSOR_API_KEY=${CURSOR_API_KEY:-}
      - ROBOT_H_CURSOR_CWD=/workspace
      - ROBOT_H_CURSOR_MODEL=${ROBOT_H_CURSOR_MODEL:-composer-2.5}
      - ROBOT_H_MAX_TOKENS=${ROBOT_H_MAX_TOKENS:-5000}
      - ROBOT_H_MAX_TOTAL_TOKENS=${ROBOT_H_MAX_TOTAL_TOKENS:-50000}
      - ROBOT_H_HEALTH_PROBE_INTERVAL_SEC=${ROBOT_H_HEALTH_PROBE_INTERVAL_SEC:-0}
      - ROBOT_H_LLM_PROMPT_PATH=/app/prompts/robot_H_llm_prompt.txt
    volumes:
      - .:/workspace:ro
    networks:
      - game-net
    restart: "no"

  cursor-llm-bridge-a:
    profiles:
      - cursor-a
    build:
      context: .
      dockerfile: cursor-llm-bridge/Dockerfile
    ports:
      - "8766:8765"
    environment:
      - ROBOT_LABEL=A
      - CURSOR_API_KEY=${CURSOR_API_KEY:-}
      - ROBOT_A_CURSOR_CWD=/workspace
      - ROBOT_A_CURSOR_MODEL=${ROBOT_A_CURSOR_MODEL:-composer-2.5}
      - ROBOT_A_MAX_TOKENS=${ROBOT_A_MAX_TOKENS:-5000}
      - ROBOT_A_MAX_TOTAL_TOKENS=${ROBOT_A_MAX_TOTAL_TOKENS:-50000}
      - ROBOT_A_HEALTH_PROBE_INTERVAL_SEC=${ROBOT_A_HEALTH_PROBE_INTERVAL_SEC:-0}
      - ROBOT_A_LLM_PROMPT_PATH=/app/prompts/robot_A_llm_prompt.txt
    volumes:
      - .:/workspace:ro
    networks:
      - game-net
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    devices:
      - /dev/dxg:/dev/dxg
    group_add:
      - ${RENDER_GID:-989}
      - ${VIDEO_GID:-985}
    environment:
      - ROBOT_A_OLLAMA_MODEL=${ROBOT_A_OLLAMA_MODEL:-${ROBOT_A_OLLAMA_MODEL_FALLBACK:-qwen2.5:3b}}
      - ROBOT_H_OLLAMA_MODEL=${ROBOT_H_OLLAMA_MODEL:-${ROBOT_H_OLLAMA_MODEL_FALLBACK:-llama3.2:1b}}
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_VULKAN=${OLLAMA_VULKAN:-1}
      - OLLAMA_IGPU_ENABLE=${OLLAMA_IGPU_ENABLE:-1}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-0}
      # AMD Renoir/Lucienne iGPU (gfx1030) — drop if you have NVIDIA + nvidia-container-toolkit
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-10.3.0}
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 5 && ollama pull \"$$ROBOT_A_OLLAMA_MODEL\" && ollama pull \"$$ROBOT_H_OLLAMA_MODEL\" && tail -f /dev/null"
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - game-net

networks:
  game-net:
    driver: bridge

volumes:
  ollama_data:
  agent_logs:
